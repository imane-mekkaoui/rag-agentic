<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentic RAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <p class="eyebrow">ENSET · LangGraph</p>
        <h1>Agentic RAG</h1>
        <p class="lede">
          Posez une question : l’agent cherche dans le CV, consulte un salarié, ou prépare un e-mail.
        </p>
        <div class="chips" id="suggestions">
          <button type="button" data-q="Qui est Mohamed Youssfi et d’où vient-il ?">CV Mohamed</button>
          <button type="button" data-q="Quel est le salaire et l’ancienneté de Yassine ?">Fiche salarié</button>
          <button type="button" data-q="Quelles sont les formations de Mohamed Youssfi ?">Parcours</button>
        </div>
        <dl class="meta">
          <div>
            <dt>Outils</dt>
            <dd>cv_tool · salarié · e-mail</dd>
          </div>
          <div>
            <dt>Modèle</dt>
            <dd>GPT-4o + Chroma</dd>
          </div>
        </dl>
        <p class="status" id="health">Vérification de l’agent…</p>
      </aside>

      <main class="stage">
        <header class="top">
          <span>Conversation</span>
          <button type="button" id="clear">Nouvelle discussion</button>
        </header>
        <section class="thread" id="thread" aria-live="polite"></section>
        <form class="composer" id="form">
          <label class="sr-only" for="input">Votre question</label>
          <textarea
            id="input"
            rows="1"
            placeholder="Demandez par exemple le parcours de Mohamed…"
            required
          ></textarea>
          <button type="submit" id="send">Envoyer</button>
        </form>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
